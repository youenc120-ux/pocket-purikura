<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f3ef">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>
<title>口袋拍貼機</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* 手繪線稿拍貼機：紙張底色、墨線外框、實體按鈕。刻意只做亮色版（紙張世界）。
   流程：外觀 → 選相框（黑白／彩色）→ 拍照或上傳（可裁切）→ 列印 → 取件 */
:root {
  --paper: #f4f3ef;
  --panel: #fbfaf7;
  --ink: #1f1e1c;
  --muted: #6b6862;
  --faint: #c9c6be;
  --go: #2fb350;
  --stop: #e0413a;
  --accent: #e2457a;
  --hand: "Gochi Hand", "LXGW WenKai TC", cursive;
  --zh: "LXGW WenKai TC", "Gochi Hand", "PingFang TC", "Microsoft JhengHei", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--zh); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
::selection { background: var(--ink); color: var(--paper); }
.defs { position: absolute; width: 0; height: 0; }
.app { max-width: 520px; margin: 0 auto; padding-block: 14px 32px; display: flex; flex-direction: column; gap: 16px; }
section { display: flex; flex-direction: column; gap: 16px; }
h2 { font-family: var(--zh); font-weight: 700; font-size: 20px; margin: 0; text-wrap: balance; }
h3 { font-size: 17px; margin: 0; }
.hint { color: var(--muted); font-size: 14px; margin: 0; line-height: 1.6; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* 手繪外框：偽元素帶抖動濾鏡，文字不受影響 */
.sk { position: relative; isolation: isolate; }
.sk::before { content: ""; position: absolute; inset: 0; border: 2.5px solid var(--ink); border-radius: var(--r, 6px); filter: url(#rough); pointer-events: none; z-index: 2; }
.sk.dbl::after { content: ""; position: absolute; inset: 9px; border: 2.5px solid var(--ink); border-radius: var(--r, 4px); filter: url(#rough); pointer-events: none; z-index: 2; }
.sk.thick::before { border-width: 3.5px; }
.sk.round { --r: 50%; }

.btn { font: inherit; font-weight: 700; font-size: 17px; color: var(--ink); background: var(--panel); border: 0; padding: 13px 20px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; transition: transform .15s ease-out; }
.btn:active { transform: translateY(2px); }
.btn.dark { background: var(--ink); color: var(--paper); }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .4; cursor: default; }
button:focus-visible, label.btn:focus-within, input:focus-visible, canvas:focus-visible { outline: 3px dashed var(--accent); outline-offset: 3px; }
.link { background: none; border: 0; font: inherit; color: var(--ink); cursor: pointer; padding: 6px 0; font-size: 16px; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--faint); }
.file-btn { position: relative; }
.file-btn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.pair { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; width: 100%; }

/* ---------- 外觀 ---------- */
.sign { background: var(--panel); padding: 18px 16px 14px; text-align: center; margin: 4px 6px 0; }
.sign-en { display: block; font-family: "Gochi Hand", cursive; font-size: clamp(34px, 11vw, 52px); letter-spacing: .08em; line-height: 1; }
.sign-zh { display: block; font-size: 15px; letter-spacing: .4em; margin-top: 4px; color: var(--muted); }
.posts { display: flex; justify-content: space-between; padding: 0 22%; height: 12px; margin: -16px 0 -16px; }
.posts i { width: 12px; border-left: 2.5px solid var(--ink); border-right: 2.5px solid var(--ink); filter: url(#rough); }
.booth { background: var(--panel); display: grid; grid-template-columns: 1fr 1.05fr .42fr; min-height: 440px; }
.booth-left { padding: 16px 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; border-right: 2.5px solid var(--ink); }
.window { width: 100%; background: #fff; padding: 16px 14px; display: flex; justify-content: center; gap: 6px; min-height: 150px; align-items: center; }
.window button { padding: 0; border: 0; background: none; cursor: pointer; height: 112px; flex: 0 1 auto; min-width: 0; }
.window img { height: 100%; width: auto; max-width: 100%; display: block; box-shadow: 0 2px 4px rgba(0,0,0,.25); transform: rotate(var(--tilt, 0deg)); }
.window .ghost-strip { width: 20px; height: 108px; background: repeating-linear-gradient(#8a8781 0 23px, #f2f1ec 23px 27px); border: 2px solid #8a8781; flex: 0 0 auto; }
.note { font-family: var(--hand); font-size: 20px; line-height: 1.05; margin: 2px 0 0; text-align: center; }
.note svg { width: 28px; height: 22px; display: block; margin: 0 auto -2px; }
.coin { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.coin .face { width: 46px; height: 40px; background: var(--panel); display: grid; place-items: center; }
.coin .face i { width: 16px; height: 4px; border-radius: 2px; background: var(--ink); }
.coin .slotbox { width: 46px; height: 78px; background: var(--panel); display: grid; place-items: center; }
.coin .slotbox i { width: 14px; height: 50px; border: 2.5px solid var(--ink); border-radius: 2px; }
.booth-right { position: relative; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
.curtain { position: absolute; inset: 0 8px 70px 8px; transform-origin: right center; transition: transform .7s cubic-bezier(.65, 0, .35, 1); }
.curtain svg { width: 100%; height: 100%; display: block; }
.booth-right.open .curtain { transform: scaleX(.12); }
.stool { position: absolute; bottom: 0; width: 70%; height: 130px; }
.enter { white-space: nowrap; position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%); z-index: 3; font-size: 19px; padding: 12px 22px; }
.enter:active { transform: translate(-50%, calc(-50% + 2px)); }
.booth-side { border-left: 2.5px solid var(--ink); padding: 18px 8px; }
.mirror { height: 46%; background: var(--panel); }
.mirror svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.footer-links { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; }
.footer-links .link { font-size: 14px; color: var(--muted); }

/* ---------- 機台內部 ---------- */
.marquee { background: var(--panel); min-height: 74px; padding: 18px 22px; display: grid; place-items: center; text-align: center; font-size: clamp(19px, 5.4vw, 24px); font-weight: 700; text-wrap: balance; }
.marquee.in { animation: rise .45s cubic-bezier(.16, 1, .3, 1); }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } }
.screen-row { position: relative; display: flex; justify-content: center; align-items: center; gap: 12px; }
.eye-note { flex: 0 0 auto; font-family: var(--hand); font-size: 20px; line-height: 1; text-align: center; }
.eye-note svg { width: 54px; height: 16px; display: block; }
@media (max-width: 459px) { .eye-note { display: none; } }
.screen { background: var(--panel); padding: 22px; width: min(100%, 330px); }
.screen-in { position: relative; display: grid; place-items: center; min-height: 250px; }
.arrow { position: absolute; top: 42%; transform: translateY(-50%); background: none; border: 0; font-size: 30px; font-family: var(--hand); cursor: pointer; color: var(--ink); width: 40px; height: 48px; z-index: 3; }
.arrow.prev { left: -6px; } .arrow.next { right: -6px; }
#frame-pick { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
.frame-prev { display: block; height: 220px; width: auto; max-width: 72%; box-shadow: 0 6px 12px rgba(0,0,0,.18); }
.frame-name { text-align: center; font-weight: 700; margin: 0; font-size: 16px; }
#source-pick { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; padding: 10px 0; }
#source-pick .btn { width: min(100%, 200px); padding: 12px 16px; }
#source-pick .btn svg { width: 20px; height: 20px; }
#upload-pick { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
.price { position: absolute; right: -6px; bottom: -30px; width: 76px; height: 76px; background: var(--panel); display: grid; place-items: center; text-align: center; font-family: var(--hand); font-size: 19px; line-height: .95; transform: rotate(-8deg); z-index: 4; }
.viewfinder { position: relative; width: 100%; max-width: 100%; overflow: hidden; background: #111; aspect-ratio: 4 / 3; }
.viewfinder video { width: 100%; height: 100%; object-fit: cover; display: block; transform: scaleX(-1); }
.viewfinder.bw video, .viewfinder.bw .freeze { filter: grayscale(1) contrast(1.15); }
.freeze { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.count { position: absolute; inset: 0; display: grid; place-items: center; font-family: "Gochi Hand", cursive; font-size: 140px; color: #fff; text-shadow: 0 4px 18px rgba(0,0,0,.55); pointer-events: none; }
.count.pop { animation: pop .9s cubic-bezier(.16, 1, .3, 1); }
@keyframes pop { from { transform: scale(1.7); opacity: 0; } 25% { opacity: 1; } to { transform: scale(.9); opacity: .15; } }
.badge { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.55); color: #fff; font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.cam-msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; color: #e9e6df; font-size: 14px; line-height: 1.7; background: repeating-linear-gradient(45deg, #26241f 0 12px, #2e2c27 12px 24px); }
.back-link { align-self: center; }
.switch { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; }
.switch span { color: var(--muted); }
.switch span.on { color: var(--ink); font-weight: 700; }
.toggle { width: 62px; height: 30px; border: 0; background: var(--panel); position: relative; cursor: pointer; padding: 0; --r: 999px; }
.toggle i { position: absolute; top: 5px; left: 6px; width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--panel); transition: left .25s cubic-bezier(.16, 1, .3, 1); }
.toggle[aria-pressed="true"] i { left: 36px; background: var(--ink); }
.thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.thumb { aspect-ratio: 4 / 3; max-width: 100%; background: var(--panel); border: 2px dashed var(--faint); overflow: hidden; display: grid; place-items: center; color: var(--muted); font-family: var(--hand); font-size: 18px; padding: 0; font-weight: 400; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.filled { border: 2px solid var(--ink); }
.console { display: grid; grid-template-columns: 1fr 84px; margin-top: 8px; gap: 12px; align-items: stretch; }
.howto { background: var(--panel); margin: 0; padding: 14px 12px; list-style: none; display: grid; grid-template-columns: repeat(3, 1fr); --r: 14px; }
.howto li { padding: 0 7px; font-size: 13px; line-height: 1.45; text-align: center; }
.howto li + li { border-left: 2.5px solid var(--ink); }
.howto b { display: block; font-family: var(--hand); font-size: 26px; line-height: 1; text-align: left; }
.howto li.now b { color: var(--accent); }
.control { background: var(--panel); display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px 8px 12px; }
.control .cap { font-family: var(--hand); font-size: 18px; margin-top: -40px; background: var(--paper); padding: 0 4px; }
.go { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--ink); background: var(--go); cursor: pointer; box-shadow: 0 4px 0 #1a6b30, inset 0 -4px 0 rgba(0,0,0,.15); transition: transform .1s, box-shadow .1s; }
.go:active { transform: translateY(3px); box-shadow: 0 1px 0 #1a6b30; }
.go.red, .go.red:disabled { background: var(--stop); box-shadow: 0 4px 0 #8e1f1a; filter: none; opacity: 1; }
.go:disabled { filter: grayscale(.8); opacity: .55; cursor: default; }
.go.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 4px 0 #1a6b30, 0 0 0 10px rgba(47, 179, 80, .22); } }
.control .slit { width: 10px; height: 34px; border: 2.5px solid var(--ink); border-radius: 3px; }
.control .bin { width: 46px; height: 40px; border: 2.5px solid var(--ink); }
.screen-flash { position: fixed; inset: 0; background: #fff; z-index: 40; pointer-events: none; opacity: 0; }
.screen-flash.go { animation: flash .5s ease-out; }
@keyframes flash { from { opacity: 1; } to { opacity: 0; } }

/* ---------- 浮層：裁切、說明頁、列印取件 ---------- */
.overlay { position: fixed; inset: 0; z-index: 20; background: var(--paper); overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 20px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(16px, env(safe-area-inset-left, 0px)); display: flex; }
.overlay-inner { max-width: 480px; margin: auto; display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; width: 100%; }
.crop-stage { background: #fff; padding: 10px; }
#crop-cv { display: block; max-width: 100%; touch-action: none; cursor: move; }
.slider { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); width: 100%; }
.slider input { width: 100%; accent-color: var(--ink); }
.info { text-align: left; align-items: stretch; }
.info article { display: flex; flex-direction: column; gap: 10px; line-height: 1.7; }
.info p, .info ul { margin: 0; }
.info ul { padding-left: 1.2em; }
.spinner { width: 54px; height: 54px; border-radius: 50%; border: 4px dashed var(--ink); animation: spin 2.4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.printer { display: flex; flex-direction: column; align-items: center; width: 100%; }
.printer-box { width: min(100%, 300px); background: var(--panel); padding: 16px 20px 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.printer-box span { font-family: var(--hand); font-size: 18px; }
.printer-box i { display: block; width: 86%; height: 14px; border: 2.5px solid var(--ink); border-radius: 3px; background: #2a2825; }
.paper { overflow: hidden; margin-top: -24px; padding: 0 14px 18px; position: relative; z-index: 3; }
.paper button { padding: 0; border: 0; background: none; cursor: pointer; display: block; }
.paper img { display: block; max-width: 100%; max-height: 60vh; box-shadow: 0 10px 24px rgba(0,0,0,.25); -webkit-touch-callout: default; }
.paper img.print { animation: print 2.6s cubic-bezier(.3, .7, .25, 1) both; }
@keyframes print { from { transform: translateY(-101%); } 70% { transform: translateY(-5%); } to { transform: translateY(0); } }
.paper img.drop { animation: drop .45s cubic-bezier(.5, 0, .9, .4) forwards; }
@keyframes drop { to { transform: translateY(40%); opacity: 0; } }
.paper img.picked { animation: picked .55s cubic-bezier(.16, 1, .3, 1); }
@keyframes picked { from { transform: translateY(30%) scale(.55) rotate(-7deg); opacity: .2; } }
.tray { width: min(100%, 300px); background: var(--panel); border: 0; padding: 12px 18px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; margin-top: 18px; font: inherit; color: var(--ink); }
.tray-label { font-family: var(--hand); font-size: 18px; }
.tray-hole { display: block; position: relative; width: 100%; height: 96px; background: #2a2825; border: 2.5px solid var(--ink); border-radius: 4px; overflow: hidden; }
.tray-hole img { position: absolute; left: 50%; top: 14px; height: 300%; width: auto; transform: translateX(-50%) rotate(-8deg); box-shadow: 0 6px 14px rgba(0,0,0,.5); }
.tray.land .tray-hole img { animation: land .5s cubic-bezier(.2, .9, .3, 1.25); }
@keyframes land { from { top: -120%; } }
.tray:hover .tray-hole img, .tray:focus-visible .tray-hole img { top: 6px; }
.tray-note { margin: 4px 0 0; animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateY(-4px); } }
.pick-actions { display: flex; flex-direction: column; gap: 14px; align-items: center; width: 100%; }
#result.making .printer, #result:not(.making) .making-msg { display: none; }
#result.making .pick-actions, #result.printing .pick-actions, #result.waiting .pick-actions { display: none; }
#result.waiting #paper { display: none; }
#result.picked #printer-box { display: none; }
#result.picked .paper { margin-top: 0; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-size: 15px; z-index: 50; max-width: calc(100% - 32px); text-align: center; }
@media (prefers-reduced-motion: reduce) {
  .count.pop, .screen-flash.go, .marquee.in, .paper img.print, .paper img.drop, .paper img.picked, .tray.land .tray-hole img, .tray-note, .spinner, .go.pulse { animation: none; }
  .curtain, .toggle i { transition: none; }
}
</style>

<svg class="defs" aria-hidden="true">
  <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
    <feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="5" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="app">
  <!-- 外觀 -->
  <section id="scr-lobby">
    <div class="sign sk dbl thick"><span class="sign-en">PHOTOBOOTH</span><span class="sign-zh">口袋拍貼機</span></div>
    <div class="posts" aria-hidden="true"><i></i><i></i></div>
    <div class="booth sk thick">
      <div class="booth-left">
        <div class="window sk dbl" id="gallery"></div>
        <p class="note"><svg viewBox="0 0 28 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 20 C 14 16, 10 12, 9 3"/><path d="M4 8 L9 2 L13 8"/></svg><span id="gallery-note">拍好的會<br>掛在這裡</span></p>
        <div class="coin" aria-hidden="true">
          <div class="face sk"><i></i></div>
          <div class="slotbox sk"><i></i></div>
        </div>
      </div>
      <div class="booth-right" id="booth-door">
        <div class="curtain" aria-hidden="true">
          <svg viewBox="0 0 100 230" preserveAspectRatio="none" fill="none" stroke="#1f1e1c" stroke-width="2.4" stroke-linecap="round" style="filter:url(#rough)">
            <path d="M4 0 C 10 50, 0 100, 8 150 S 4 210, 10 230" />
            <path d="M24 0 C 30 40, 18 90, 26 140 S 20 200, 28 230" />
            <path d="M44 0 C 50 60, 38 110, 46 160 S 40 205, 47 230" />
            <path d="M64 0 C 58 50, 70 95, 62 145 S 68 200, 63 230" />
            <path d="M84 0 C 90 45, 78 100, 86 150 S 80 210, 88 230" />
            <path d="M98 0 L98 230" />
            <path d="M2 228 C 30 220, 70 236, 99 226" />
          </svg>
        </div>
        <svg class="stool" viewBox="0 0 100 130" fill="none" stroke="#1f1e1c" stroke-width="2.6" style="filter:url(#rough)" aria-hidden="true">
          <ellipse cx="50" cy="16" rx="34" ry="11" fill="#fbfaf7"/>
          <path d="M16 16 v10 c 0 8 68 8 68 0 v-10"/>
          <path d="M44 34 v76 M56 34 v76"/>
          <ellipse cx="50" cy="116" rx="26" ry="8" fill="#fbfaf7"/>
        </svg>
        <button class="btn sk enter" id="enter">進入 →</button>
      </div>
      <div class="booth-side" aria-hidden="true">
        <div class="mirror sk">
          <svg viewBox="0 0 40 120" preserveAspectRatio="none" fill="none" stroke="#1f1e1c" stroke-width="2" stroke-linecap="round" style="filter:url(#rough)">
            <path d="M10 18 L22 10 M12 26 L26 16"/><path d="M16 104 L30 94 M20 110 L32 102"/>
          </svg>
        </div>
      </div>
    </div>
    <nav class="footer-links" aria-label="說明">
      <button class="link" data-info="privacy">隱私權政策</button>
      <button class="link" data-info="faq">常見問題</button>
      <button class="link" data-info="about">關於</button>
    </nav>
  </section>

  <!-- 機台內部：choose 選相框 → source 拍照或上傳 → shoot 拍照 / upload 上傳 -->
  <section id="scr-machine" hidden>
    <button class="link back-link" id="exit" style="align-self:flex-start">← 離開機台</button>
    <div class="marquee sk dbl thick" id="marquee">用箭頭挑一個相框</div>
    <div class="screen-row">
      <div class="eye-note" aria-hidden="true">眼睛<br>看這裡<svg viewBox="0 0 54 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2 8 H50 M42 2 L51 8 L42 14"/></svg></div>
      <div class="screen sk dbl thick">
        <div class="screen-in">
          <div id="frame-pick">
            <button class="arrow prev" id="prev" aria-label="上一個相框">‹</button>
            <canvas class="frame-prev" id="frame-prev"></canvas>
            <p class="frame-name" id="frame-name"></p>
            <button class="arrow next" id="next" aria-label="下一個相框">›</button>
          </div>
          <div id="source-pick" hidden>
            <button class="btn sk" id="src-cam">拍照 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>

<script>
const $ = (id) => document.getElementById(id);
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- 拍貼條規格：固定 4 格直條 ----------
const STRIP = { W: 600, H: 1800, foot: { y: 1672, h: 128 },
  cells: [0, 1, 2, 3].map(i => ({ x: 40, y: 40 + i * 414, w: 520, h: 390 })) };
const ASPECT = 520 / 390;
const Q = 2; // 輸出 1200 × 3600
const FRAMES = [
  { id: "white",     name: "白框" },
  { id: "black",     name: "黑框" },
  { id: "doodle",    name: "塗鴉框" },
  { id: "stars",     name: "星星框" },
  { id: "hearts",    name: "愛心框" },
  { id: "heartcut",  name: "愛心鏤空框" },
  { id: "birthday",  name: "生日快樂" },
  { id: "valentine", name: "情人節" },
  { id: "newyear",   name: "新年快樂" },
];

const S = { color: true, frame: 0, shots: [null, null, null, null], mode: "choose" };
let stream = null, busy = false;

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 3000);
}
function setMarquee(text) {
  const m = $("marquee"); if (m.textContent === text) return;
  m.textContent = text; m.classList.remove("in"); void m.offsetWidth; m.classList.add("in");
}

// ---------- 音效（全部用程式合成，不載入音檔） ----------
let audioCtx = null;
function ac() { return (audioCtx ||= new (window.AudioContext || window.webkitAudioContext)()); }
function beep(freq, dur) {
  try {
    const a = ac(), o = a.createOscillator(), g = a.createGain();
    o.frequency.value = freq; g.gain.value = .08; o.connect(g).connect(a.destination); o.start();
    g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + dur); o.stop(a.currentTime + dur);
  } catch (e) {}
}
function shutter() {
  try {
    const a = ac(), len = a.sampleRate * .12, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const s = a.createBufferSource(), g = a.createGain(); g.gain.value = .35; s.buffer = buf; s.connect(g).connect(a.destination); s.start();
  } catch (e) {}
}
function whirr() {
  try {
    const a = ac(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
    o.type = "sawtooth"; o.frequency.setValueAtTime(70, t); o.frequency.linearRampToValueAtTime(95, t + 2.2);
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.03, t + .2); g.gain.setValueAtTime(.03, t + 2.1); g.gain.linearRampToValueAtTime(.0001, t + 2.4);
    o.connect(g).connect(a.destination); o.start(); o.stop(t + 2.5);
  } catch (e) {}
}

// ---------- 外觀與展示窗（最近 4 張，只存在這台裝置） ----------
function loadGallery() { try { return JSON.parse(localStorage.getItem("booth-gallery") || "[]"); } catch (e) { return []; } }
function saveToGallery(canvas) {
  const t = document.createElement("canvas"), w = 300;
  t.width = w; t.height = Math.round(canvas.height * w / canvas.width);
  t.getContext("2d").drawImage(canvas, 0, 0, t.width, t.height);
  const g = [t.toDataURL("image/jpeg", .78), ...loadGallery()].slice(0, 4);
  try { localStorage.setItem("booth-gallery", JSON.stringify(g)); } catch (e) {}
}
function buildGallery() {
  const g = loadGallery(), el = $("gallery");
  el.innerHTML = "";
  if (!g.length) {
    for (let k = 0; k < 4; k++) { const i = document.createElement("i"); i.className = "ghost-strip"; el.append(i); }
    $("gallery-note").innerHTML = "拍好的會<br>掛在這裡";
    return;
  }
  g.forEach((url, k) => {
    const b = document.createElement("button");
    b.setAttribute("aria-label", `打開第 ${k + 1} 張拍貼`);
    b.innerHTML = `<img alt="" src="${url}" style="--tilt:${[-3, 2, -1, 3][k]}deg">`;
    b.onclick = async () => { lastBlob = await (await fetch(url)).blob(); showResult(URL.createObjectURL(lastBlob), false); };
    el.append(b);
  });
  $("gallery-note").innerHTML = "我的<br>拍貼";
}
$("enter").onclick = async () => {
  $("booth-door").classList.add("open"); beep(520, .08);
  await wait(reduceMotion() ? 0 : 650);
  $("scr-lobby").hidden = true; $("scr-machine").hidden = false; window.scrollTo(0, 0);
  setMode("choose");
  $("booth-door").classList.remove("open");
};
function leaveMachine() {
  stopCamera(); busy = false;
  $("result").hidden = true; $("scr-machine").hidden = true; $("scr-lobby").hidden = false;
  buildGallery(); window.scrollTo(0, 0);
}
$("exit").onclick = () => { if (!busy) leaveMachine(); };

// ---------- 說明頁 ----------
const INFO = {
  privacy: ["隱私權政策", `
    <p>口袋拍貼機的照片全部在你的手機或電腦上處理，不會上傳到任何伺服器。</p>
    <ul>
      <li>相機畫面只用來拍你按下綠色按鈕後的 4 張照片。</li>
      <li>拍好的拍貼只有在你按「下載」或「分享」時才會離開這台裝置。</li>
      <li>展示窗裡的最近 4 張拍貼存在這個瀏覽器的本機儲存空間，清除網站資料就會刪掉。</li>
      <li>網頁會從 Google Fonts 載入字型。</li>
    </ul>`],
  faq: ["常見問題", `
    <h3>按了拍照沒有畫面？</h3>
    <p>請允許瀏覽器使用相機。如果是從 LINE、IG 等 App 裡打開的，請改用 Safari 或 Chrome。</p>
    <h3>可以用手機裡的照片嗎？</h3>
    <p>可以，選「上傳照片」，一張一張選，每張都能裁切。</p>
    <h3>照片怎麼存起來？</h3>
    <p>拿到照片後點一下就會下載；手機上也可以長按照片存進相簿。</p>
    <h3>要錢嗎？</h3>
    <p>不用，一次 4 張，免費。</p>`],
  about: ["關於", `
    <p>口袋拍貼機是一台畫在網頁上的拍貼機：拉開布簾、選相框、拍 4 張，等它從出紙口印出來。</p>
    <p>不用下載 App，手機打開網頁就能拍。</p>`],
};
document.querySelectorAll("[data-info]").forEach(b => b.onclick = () => {
  const [t, html] = INFO[b.dataset.info];
  $("info-title").textContent = t; $("info-body").innerHTML = html; $("info").hidden = false;
  $("info-close").focus();
});
$("info-close").onclick = () => ($("info").hidden = true);

// ---------- 相框圖案（全部用程式畫） ----------
function seeded(seed) { let s = seed * 9301 + 49297; return () => ((s = (s * 16807) % 2147483647) / 2147483647); }
function heartPath(ctx, x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + s * .3);
  ctx.bezierCurveTo(x, y, x - s * .5, y, x - s * .5, y + s * .3);
  ctx.bezierCurveTo(x - s * .5, y + s * .6, x, y + s * .8, x, y + s);
  ctx.bezierCurveTo(x, y + s * .8, x + s * .5, y + s * .6, x + s * .5, y + s * .3);
  ctx.bezierCurveTo(x + s * .5, y, x, y, x, y + s * .3); ctx.closePath();
}
function starPath(ctx, x, y, r, rot = 0) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot - Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * .45 : r;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath();
}
function sparkle(ctx, x, y, r) {
  ctx.beginPath(); ctx.moveTo(x, y - r);
  ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r);
  ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r); ctx.fill();
}
// 在相框邊緣（不擋到照片中央）挑位置
function marginSpots(n, seed) {
  const rnd = seeded(seed), out = [];
  for (let k = 0; out.length < n && k < n * 20; k++) {
    const side = rnd();
    let x, y = 20 + rnd() * (STRIP.H - 40);
    if (side < .4) x = 6 + rnd() * 44; else if (side < .8) x = STRIP.W - 6 - rnd() * 44;
    else { x = 40 + rnd() * 520; const c = STRIP.cells[Math.floor(rnd() * 4)]; y = c.y + c.h + 4 + rnd() * 18; }
    out.push([x, y, rnd()]);
  }
  return out;
}
const FRAME_STYLE = {
  white:     { bg: "#ffffff" },
  black:     { bg: "#141414" },
  doodle:    { bg: "#ffffff" },
  stars:     { bg: "#16224a" },
  hearts:    { bg: "#ffd3df" },
  heartcut:  { bg: "#ff9cbc" },
  birthday:  { bg: "#fff4cf", text: "HAPPY BIRTHDAY", ink: "#e2457a" },
  valentine: { bg: "#ffe4ea", text: "HAPPY VALENTINE'S DAY", ink: "#c81e4a" },
  newyear:   { bg: "#121212", text: "HAPPY NEW YEAR 2026", ink: "#f2c94c" },
};
function drawFrameBack(ctx, id) {
  ctx.fillStyle = FRAME_STYLE[id].bg; ctx.fillRect(0, 0, STRIP.W, STRIP.H);
}
function drawFrameFront(ctx, id) {
  const st = FRAME_STYLE[id];
  ctx.save();
  if (id === "doodle") {
    ctx.strokeStyle = "#222"; ctx.lineWidth = 3.2; ctx.lineCap = "round"; ctx.lineJoin = "round";
    marginSpots(26, 4).forEach(([x, y, t], k) => {
      ctx.beginPath();
      if (k % 4 === 0) { for (let a = 0; a < 12; a += .3) ctx.lineTo(x + Math.cos(a) * a * 1.3, y + Math.sin(a) * a * 1.3); ctx.stroke(); }
      else if (k % 4 === 1) { starPath(ctx, x, y, 13, t); ctx.stroke(); }
      else if (k % 4 === 2) { ctx.moveTo(x - 16, y); for (let i = 0; i <= 8; i++) ctx.lineTo(x - 16 + i * 4, y + (i % 2 ? -6 : 6)); ctx.stroke(); }
      else { heartPath(ctx, x, y - 10, 22); ctx.stroke(); }
    });
    ctx.beginPath(); ctx.arc(300, 1736, 26, .2, Math.PI - .2); ctx.stroke();
    ctx.fillStyle = "#222"; ctx.beginPath(); ctx.arc(288, 1716, 4, 0, 7); ctx.arc(312, 1716, 4, 0, 7); ctx.fill();
  } else if (id === "stars") {
    marginSpots(34, 9).forEach(([x, y, t]) => { ctx.fillStyle = t < .5 ? "#ffe066" : "#fff6c4"; starPath(ctx, x, y, 7 + t * 9, t * 2); ctx.fill(); });
  } else if (id === "hearts" || id === "valentine") {
    marginSpots(30, id === "hearts" ? 6 : 12).forEach(([x, y, t]) => { ctx.fillStyle = t < .5 ? "#e8335f" : "#ff7aa0"; heartPath(ctx, x, y - 9, 16 + t * 10); ctx.fill(); });
  } else if (id === "heartcut") {
    marginSpots(26, 3).forEach(([x, y, t]) => { ctx.fillStyle = "#fff"; heartPath(ctx, x, y - 7, 12 + t * 8); ctx.fill(); });
  } else if (id === "birthday") {
    const rnd = seeded(8), cols = ["#e2457a", "#2fa5e0", "#f2c94c", "#5cc58a", "#9b6bff"];
    marginSpots(46, 8).forEach(([x, y]) => {
      ctx.fillStyle = cols[Math.floor(rnd() * cols.length)];
      ctx.save(); ctx.translate(x, y); ctx.rotate(rnd() * 6);
      if (rnd() < .5) ctx.fillRect(-6, -3, 12, 6); else { ctx.beginPath(); ctx.arc(0, 0, 5, 0, 7); ctx.fill(); }
      ctx.restore();
    });
  } else if (id === "newyear") {
    marginSpots(36, 15).forEach(([x, y, t]) => { ctx.fillStyle = t < .5 ? "#f2c94c" : "#fff2c2"; sparkle(ctx, x, y, 6 + t * 12); });
  }
  if (st.text) {
    ctx.fillStyle = st.ink; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    let size = 52; ctx.font = `${size}px "Gochi Hand", cursive`;
    while (ctx.measureText(st.text).width > 520 && size > 24) { size -= 2; ctx.font = `${size}px "Gochi Hand", cursive`; }
    ctx.fillText(st.text, STRIP.W / 2, STRIP.foot.y + STRIP.foot.h / 2);
  }
  ctx.restore();
}
// 照片放進格子：愛心鏤空框是愛心形狀，其他是方格
function cellClip(ctx, id, c) {
  if (id === "heartcut") { const s = c.h * 1.02; heartPath(ctx, c.x + c.w / 2, c.y + (c.h - s) / 2 + 4, s); }
  else { ctx.beginPath(); ctx.rect(c.x, c.y, c.w, c.h); }
}
function drawPhoto(ctx, src, c) {
  const s = Math.max(c.w / src.width, c.h / src.height), sw = c.w / s, sh = c.h / s;
  ctx.drawImage(src, (src.width - sw) / 2, (src.height - sh) / 2, sw, sh, c.x, c.y, c.w, c.h);
}
function toBW(canvas) {
  const ctx = canvas.getContext("2d"), img = ctx.getImageData(0, 0, canvas.width, canvas.height), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    let l = .299 * d[i] + .587 * d[i + 1] + .114 * d[i + 2];
    l = (l - 128) * 1.18 + 134;
    d[i] = d[i + 1] = d[i + 2] = l;
  }
  ctx.putImageData(img, 0, 0);
}
function buildStrip() {
  const id = FRAMES[S.frame].id, out = document.createElement("canvas");
  out.width = STRIP.W * Q; out.height = STRIP.H * Q;
  const ctx = out.getContext("2d"); ctx.scale(Q, Q); ctx.imageSmoothingQuality = "high";
  drawFrameBack(ctx, id);
  // 照片先畫在獨立的圖層，黑白模式只處理照片
  const ph = document.createElement("canvas"); ph.width = out.width; ph.height = out.height;
  const pc = ph.getContext("2d"); pc.scale(Q, Q); pc.imageSmoothingQuality = "high";
  STRIP.cells.forEach((c, k) => { pc.save(); cellClip(pc, id, c); pc.clip(); drawPhoto(pc, S.shots[k], c); pc.restore(); });
  if (!S.color) toBW(ph);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(ph, 0, 0); ctx.restore();
  drawFrameFront(ctx, id);
  return out;
}
function drawFramePreview() {
  const id = FRAMES[S.frame].id, c = $("frame-prev"), k = 220 * 2 / STRIP.H;
  c.width = Math.round(STRIP.W * k); c.height = Math.round(STRIP.H * k);
  const ctx = c.getContext("2d"); ctx.scale(k, k);
  drawFrameBack(ctx, id);
  ctx.fillStyle = "#7a776f";
  STRIP.cells.forEach(cell => { ctx.save(); cellClip(ctx, id, cell); ctx.fill(); ctx.restore(); });
  drawFrameFront(ctx, id);
  $("frame-name").textContent = FRAMES[S.frame].name;
}

// ---------- 機台狀態 ----------
function syncColor() {
  $("color-toggle").setAttribute("aria-pressed", S.color);
  $("lbl-color").classList.toggle("on", S.color); $("lbl-bw").classList.toggle("on", !S.color);
  $("vf").classList.toggle("bw", !S.color);
}
$("color-toggle").onclick = () => { S.color = !S.color; beep(400, .05); syncColor(); };
$("prev").onclick = () => { S.frame = (S.frame + FRAMES.length - 1) % FRAMES.length; beep(660, .05); drawFramePreview(); };
$("next").onclick = () => { S.frame = (S.frame + 1) % FRAMES.length; beep(660, .05); drawFramePreview(); };

function filled() { return S.shots.filter(Boolean).length; }
function setMode(mode) {
  S.mode = mode;
  const m = mode;
  $("frame-pick").hidden = m !== "choose";
  $("source-pick").hidden = m !== "source";
  $("vf").hidden = m !== "shoot";
  $("upload-pick").hidden = m !== "upload";
  $("color-switch").hidden = m !== "choose";
  $("thumbs").hidden = m !== "shoot" && m !== "upload";
  $("back").hidden = m === "choose" || busy;
  const go = $("go");
  go.classList.toggle("red", m === "source" || busy);
  go.disabled = !busy && (m === "source" || (m === "upload" && filled() < 4));
  go.classList.toggle("pulse", !go.disabled && !busy);
  go.setAttribute("aria-label", { choose: "選這個相框", source: "先選拍照或上傳", shoot: "開始拍照", upload: "印出拍貼" }[m]);
  [...$("howto").children].forEach((li, k) => li.classList.toggle("now", m === "choose" ? k === 1 : k === 2));
  if (m === "choose") { setMarquee("用箭頭挑一個相框"); drawFramePreview(); syncColor(); }
  if (m === "source") setMarquee("要拍照，還是上傳照片？");
  if (m === "upload") { setMarquee(filled() < 4 ? `上傳第 ${filled() + 1} 張照片` : "照片齊了！按綠色按鈕印出來"); syncUploadLabel(); }
  buildThumbs();
}
function buildThumbs() {
  $("thumbs").innerHTML = S.shots.map((s, i) =>
    s ? `<div class="thumb filled"><img alt="第 ${i + 1} 張" src="${s.toDataURL("image/jpeg", .6)}"></div>` : `<div class="thumb">${i + 1}</div>`).join("");
}
$("go").onclick = () => {
  if (busy) return;
  if (S.mode === "choose") { beep(520, .08); setMode("source"); }
  else if (S.mode === "shoot") runShoot();
  else if (S.mode === "upload" && filled() === 4) makeStrip();
};
$("back").onclick = () => { stopCamera(); S.shots = [null, null, null, null]; setMode("choose"); };
$("src-cam").onclick = async () => {
  S.shots = [null, null, null, null]; setMode("shoot");
  setMarquee("相機準備中…");
  const ok = await startCamera();
  setMarquee(ok ? "看鏡頭，按綠色按鈕開始拍 4 張" : "相機無法使用，可以改用上傳照片");
  $("go").disabled = !ok; $("go").classList.toggle("pulse", ok);
};
$("src-upload").onclick = () => { S.shots = [null, null, null, null]; setMode("upload"); };

// ---------- 拍照 ----------
const CAM_ERRORS = {
  NotAllowedError: "相機權限被拒絕了。請在瀏覽器設定裡允許使用相機，再試一次。",
  SecurityError: "相機權限被拒絕了。請在瀏覽器設定裡允許使用相機，再試一次。",
  NotFoundError: "這台裝置找不到相機。",
  NotReadableError: "相機正在被其他 App 使用，請先關掉那個 App。",
  OverconstrainedError: "這台裝置的相機不符合需要的規格。",
};
async function startCamera() {
  stopCamera();
  const msg = $("cam-msg"); msg.hidden = true; $("shot-badge").textContent = "1 / 4";
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw Object.assign(new Error(), { name: "NotFoundError" });
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false });
    $("video").srcObject = stream; await $("video").play();
    return true;
  } catch (e) {
    msg.textContent = (CAM_ERRORS[e.name] || "無法開啟相機。") + " 也可以按「← 換相框」回去改用上傳照片。";
    msg.hidden = false;
    return false;
  }
}
function stopCamera() { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; }
function grabFrame() {
  const v = $("video"), cv = document.createElement("canvas");
  cv.width = v.videoWidth; cv.height = v.videoHeight;
  const ctx = cv.getContext("2d"); ctx.translate(cv.width, 0); ctx.scale(-1, 1); ctx.drawImage(v, 0, 0);
  const f = $("screen-flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
  shutter();
  return cv;
}
async function runShoot() {
  if (!stream) return;
  busy = true; setMode("shoot");
  try { await navigator.wakeLock?.request("screen"); } catch (e) {}
  for (let i = 0; i < 4; i++) {
    setMarquee(`第 ${i + 1} 張`); $("shot-badge").textContent = `${i + 1} / 4`;
    await wait(i ? 700 : 300);
    const c = $("count");
    for (let n = 3; n > 0; n--) { c.textContent = n; c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop"); beep(880, .12); await wait(1000); }
    c.textContent = "";
    S.shots[i] = grabFrame(); buildThumbs();
    $("freeze").src = S.shots[i].toDataURL("image/jpeg", .7); $("freeze").hidden = false;
    await wait(900); $("freeze").hidden = true;
  }
  stopCamera(); busy = false;
  makeStrip();
}

// ---------- 上傳與裁切 ----------
function syncUploadLabel() {
  const n = filled();
  $("upload-label").firstChild.textContent = n < 4 ? `選第 ${n + 1} 張照片` : "重新選照片";
}
const MAX_FILE_MB = 25;
async function fileToCanvas(file) {
  let img, url = null;
  try { img = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch (e) { url = URL.createObjectURL(file); img = new Image(); img.src = url; await img.decode(); }
  try {
    const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
    const scale = Math.min(1, 2400 / Math.max(iw, ih));
    const cv = document.createElement("canvas");
    cv.width = Math.round(iw * scale); cv.height = Math.round(ih * scale);
    if (!cv.width || !cv.height) throw new Error("empty");
    const ctx = cv.getContext("2d"); ctx.imageSmoothingQuality = "high"; ctx.drawImage(img, 0, 0, cv.width, cv.height);
    return cv;
  } finally { if (url) URL.revokeObjectURL(url); img?.close?.(); }
}
$("upload-file").onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  if (f.size > MAX_FILE_MB * 1024 * 1024) return toast(`檔案太大了，請選 ${MAX_FILE_MB} MB 以下的照片。`);
  if (filled() === 4) { S.shots = [null, null, null, null]; }
  try { openCrop(await fileToCanvas(f)); }
  catch (err) { toast("這張照片讀不出來，請換一張試試。"); }
};
const crop = { src: null, x: 0, y: 0, w: 0, h: 0, k: 1 };
function cropMax() { return Math.min(crop.src.width, crop.src.height * ASPECT); }
function clampCrop() {
  crop.x = Math.min(Math.max(crop.x, 0), crop.src.width - crop.w);
  crop.y = Math.min(Math.max(crop.y, 0), crop.src.height - crop.h);
}
function drawCrop() {
  const cv = $("crop-cv"), ctx = cv.getContext("2d"), k = crop.k;
  ctx.drawImage(crop.src, 0, 0, cv.width, cv.height);
  ctx.fillStyle = "rgba(20,18,16,.55)";
  ctx.beginPath(); ctx.rect(0, 0, cv.width, cv.height); ctx.rect(crop.x * k, crop.y * k, crop.w * k, crop.h * k); ctx.fill("evenodd");
  ctx.setLineDash([10, 6]); ctx.lineWidth = 3; ctx.strokeStyle = "#fff"; ctx.strokeRect(crop.x * k, crop.y * k, crop.w * k, crop.h * k);
}
function resizeCrop(pct) {
  const cx = crop.x + crop.w / 2, cy = crop.y + crop.h / 2;
  crop.w = cropMax() * pct / 100; crop.h = crop.w / ASPECT;
  crop.x = cx - crop.w / 2; crop.y = cy - crop.h / 2; clampCrop(); drawCrop();
}
function openCrop(src) {
  crop.src = src;
  const cv = $("crop-cv"), maxW = Math.min(460, window.innerWidth - 60), maxH = window.innerHeight * .55;
  crop.k = Math.min(maxW / src.width, maxH / src.height);
  cv.width = Math.round(src.width * crop.k); cv.height = Math.round(src.height * crop.k);
  $("crop-size").value = 100; crop.w = cropMax(); crop.h = crop.w / ASPECT;
  crop.x = (src.width - crop.w) / 2; crop.y = (src.height - crop.h) / 2;
  drawCrop(); $("crop").hidden = false; cv.focus();
}
$("crop-size").oninput = (e) => resizeCrop(+e.target.value);
let cropDrag = null;
$("crop-cv").addEventListener("pointerdown", (e) => {
  cropDrag = { x: e.clientX, y: e.clientY, ox: crop.x, oy: crop.y };
  $("crop-cv").setPointerCapture(e.pointerId);
});
$("crop-cv").addEventListener("pointermove", (e) => {
  if (!cropDrag) return;
  const r = $("crop-cv").getBoundingClientRect(), s = crop.src.width / r.width;
  crop.x = cropDrag.ox + (e.clientX - cropDrag.x) * s; crop.y = cropDrag.oy + (e.clientY - cropDrag.y) * s;
  clampCrop(); drawCrop();
});
$("crop-cv").addEventListener("pointerup", () => (cropDrag = null));
$("crop-cv").addEventListener("keydown", (e) => {
  const step = crop.src.width * .02, d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
  if (!d) return;
  e.preventDefault(); crop.x += d[0]; crop.y += d[1]; clampCrop(); drawCrop();
});
$("crop-cancel").onclick = () => ($("crop").hidden = true);
$("crop-ok").onclick = () => {
  const out = document.createElement("canvas");
  out.width = Math.round(crop.w); out.height = Math.round(crop.h);
  const ctx = out.getContext("2d"); ctx.imageSmoothingQuality = "high";
  ctx.drawImage(crop.src, crop.x, crop.y, crop.w, crop.h, 0, 0, out.width, out.height);
  S.shots[S.shots.findIndex(s => !s)] = out;
  $("crop").hidden = true; setMode("upload");
};

// ---------- 製作、列印、取件 ----------
// making 製作中 → printing 從出紙口印出 → waiting 掉進取件口 → picked 拿在手上
let lastBlob = null, printTimer = 0;
function setPhase(phase) {
  const r = $("result");
  ["making", "printing", "waiting", "picked"].forEach(p => r.classList.toggle(p, p === phase));
  $("tray").hidden = $("tray-note").hidden = phase !== "waiting";
  $("result-title").textContent = { making: "製作拍貼中…", printing: "列印中…", waiting: "照片印好了！", picked: "你的拍貼！" }[phase];
}
async function makeStrip() {
  $("result").hidden = false; setPhase("making");
  await document.fonts.load('52px "Gochi Hand"').catch(() => {});
  await wait(reduceMotion() ? 0 : 900);
  try {
    const out = buildStrip();
    lastBlob = await new Promise((res, rej) => out.toBlob(b => (b ? res(b) : rej(new Error("empty"))), "image/jpeg", .93));
    saveToGallery(out);
    showResult(URL.createObjectURL(lastBlob), true);
    whirr();
  } catch (e) {
    $("result").hidden = true; toast("拍貼做不出來，請再試一次。");
  }
}
function showResult(url, animate) {
  const img = $("result-img");
  if (img.src.startsWith("blob:") && img.src !== url) URL.revokeObjectURL(img.src);
  img.src = url; $("tray-img").src = url;
  $("share").hidden = !(lastBlob && navigator.canShare && navigator.canShare({ files: [new File([lastBlob], "p.jpg", { type: lastBlob.type })] }));
  img.classList.remove("print", "drop", "picked"); clearTimeout(printTimer);
  $("result").hidden = false;
  if (!animate) return setPhase("picked");
  setPhase("printing");
  void img.offsetWidth; img.classList.add("print");
  const fast = reduceMotion();
  printTimer = setTimeout(() => {
    img.classList.remove("print"); img.classList.add("drop");
    printTimer = setTimeout(() => {
      setPhase("waiting");
      const t = $("tray"); t.classList.remove("land"); void t.offsetWidth; t.classList.add("land");
      beep(330, .12); t.focus({ preventScroll: true });
    }, fast ? 0 : 450);
  }, fast ? 0 : 2600);
}
$("tray").onclick = () => {
  const img = $("result-img");
  img.classList.remove("drop", "print"); setPhase("picked");
  void img.offsetWidth; img.classList.add("picked"); beep(880, .06);
};
function fileName() {
  const d = new Date(), p = (n) => String(n).padStart(2, "0");
  return `拍貼_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.jpg`;
}
async function download() {
  if (!lastBlob) return;
  const dl = window.claude?.use ? await window.claude.use("downloads").catch(() => null) : null;
  if (dl) {
    try { await dl.save({ filename: fileName(), data: lastBlob }); toast("已存好拍貼"); }
    catch (e) { if (e?.code !== "declined") toast("這裡無法下載，請長按照片儲存"); }
    return;
  }
  const a = document.createElement("a"); a.href = $("result-img").src; a.download = fileName();
  document.body.append(a); a.click(); a.remove();
}
$("dl").onclick = download;
$("paper-btn").onclick = () => { if ($("result").classList.contains("picked")) download(); };
$("share").onclick = async () => {
  try { await navigator.share({ files: [new File([lastBlob], fileName(), { type: lastBlob.type })], text: "來看我的拍貼！" }); }
  catch (e) { if (e?.name !== "AbortError") toast("這台裝置不支援分享，請先下載再傳給朋友"); }
};
$("again").onclick = () => { $("result").hidden = true; S.shots = [null, null, null, null]; setMode("choose"); };
$("leave").onclick = leaveMachine;

buildGallery();
</script>
